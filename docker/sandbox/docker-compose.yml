services:

  # ── Sandbox proxy (this repo) ──────────────────────────────────────────────
  sandbox:
    # Registry-agnostic: set SANDBOX_IMAGE in .env to a registry the host can reach
    # (e.g. GCP Artifact Registry for GCP CVMs; the aliyun VPC registry is only
    # reachable from inside that VPC). Falls back to the aliyun ref if unset.
    image: ${SANDBOX_IMAGE:-eliza-registry-vpc.ap-southeast-1.cr.aliyuncs.com/eliza/0g-sandbox:sandbox}
    pull_policy: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Daytona API — internal only; must never be changed to a public URL.
      DAYTONA_API_URL:         http://api:3000
      DAYTONA_ADMIN_KEY:       ${DAYTONA_ADMIN_KEY}
      # Redis (sandbox's own instance, separate from Daytona's)
      REDIS_ADDR:              sandbox-redis:6379
      REDIS_PASSWORD:          ${REDIS_PASSWORD:-}
      # TEE / Chain
      SETTLEMENT_CONTRACT:     ${SETTLEMENT_CONTRACT:?SETTLEMENT_CONTRACT is required}
      TAPP_REGISTRY:           ${TAPP_REGISTRY:?TAPP_REGISTRY is required}
      CHAIN_ID:                ${CHAIN_ID:-16602}
      RPC_URL:                 ${RPC_URL:-https://evmrpc-testnet.0g.ai}
      PROVIDER_ADDRESS:        ${PROVIDER_ADDRESS:?PROVIDER_ADDRESS is required}
      # Comma-separated list of operator wallets allowed to call admin-only
      # endpoints (snapshot/registry management, archive-all, force-delete,
      # sessions). Empty defaults to [PROVIDER_ADDRESS] for single-key setups.
      ADMIN_ADDRESSES:         ${ADMIN_ADDRESSES:-}
      # Proxy domain — copied into sealed sandbox containers as
      # SANDBOX_PROXY_DOMAIN so bootstrap can compose its public URL.
      # See sealed/EVOLUTION_DESIGN.md section 15.5.
      PROXY_DOMAIN:            ${PROXY_DOMAIN:-}
      # Billing parameters (neuron; 1 0G = 10^18 neuron)
      COMPUTE_PRICE_PER_SEC:   ${COMPUTE_PRICE_PER_SEC:-16667}
      CREATE_FEE:              ${CREATE_FEE:-5000000}
      VOUCHER_INTERVAL_SEC:    ${VOUCHER_INTERVAL_SEC:-60}
      # Provider-wide gate: reject create requests without "sealed": true.
      SEALED_ONLY:             ${SEALED_ONLY:-false}
      SSH_GATEWAY_HOST:        ${SSH_GATEWAY_HOST:-}
      BROKER_URL:              ${BROKER_URL:-}
      PORT:                    8080
      # TEE key — fetched from tapp-daemon via gRPC
      BACKEND_TAPP_IP:         ${BACKEND_TAPP_IP:-127.0.0.1}
      BACKEND_TAPP_PORT:       ${BACKEND_TAPP_PORT:-50051}
      BACKEND_APP_NAME:        ${BACKEND_APP_NAME:-0g-sandbox}
      # Dev-only mock overrides (leave empty in production)
      MOCK_TEE:                ${MOCK_TEE:-}
      MOCK_APP_PRIVATE_KEY:    ${MOCK_APP_PRIVATE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/app/.env:ro   # ensures tapp-cli uploads .env for compose variable substitution
    depends_on:
      sandbox-redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

  sandbox-redis:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    volumes:
      - ${SANDBOX_REDIS_DATA:-sandbox_redis_data}:/data
    command: >
      redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net
    restart: unless-stopped

  # ── Daytona ───────────────────────────────────────────────────────────────
  # Port 3000 is intentionally NOT published. All external API access must go
  # through the sandbox proxy on port 8080.
  api:
    # publicPorts (per-port public preview) needs the 0g-daytona fork images;
    # the official image silently drops the field and the billing proxy then
    # rejects publicPorts creates with 502.
    image: ${DAYTONA_API_IMAGE:-daytonaio/daytona-api:v0.189.0-amd64}
    environment:
      - OTEL_ENABLED=false
      # Snapshot used when a create request doesn't specify one. Per-env: a
      # sealed-only provider should default to its sealed snapshot. Daytona
      # protects the default snapshot from deletion, so don't point it at one
      # you intend to delete.
      - DEFAULT_SNAPSHOT=${DEFAULT_SNAPSHOT:-daytonaio/sandbox:0.5.0-slim}
      - ENCRYPTION_KEY=${DAYTONA_ENCRYPTION_KEY}
      - ENCRYPTION_SALT=${DAYTONA_ENCRYPTION_SALT}
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DAYTONA_DB_USER}
      - DB_PASSWORD=${DAYTONA_DB_PASSWORD}
      - DB_DATABASE=${DAYTONA_DB_NAME}
      - REDIS_HOST=daytona-redis
      - REDIS_PORT=6379
      - OIDC_CLIENT_ID=daytona
      - OIDC_ISSUER_BASE_URL=http://dex:5556/dex
      - PUBLIC_OIDC_DOMAIN=http://localhost:5556/dex
      - OIDC_AUDIENCE=daytona
      - OIDC_MANAGEMENT_API_ENABLED=
      - OIDC_MANAGEMENT_API_CLIENT_ID=
      - OIDC_MANAGEMENT_API_CLIENT_SECRET=
      - OIDC_MANAGEMENT_API_AUDIENCE=
      - DASHBOARD_URL=http://localhost:3000/dashboard
      - DASHBOARD_BASE_API_URL=http://localhost:3000
      - TRANSIENT_REGISTRY_URL=http://registry:6000
      - TRANSIENT_REGISTRY_ADMIN=admin
      - TRANSIENT_REGISTRY_PASSWORD=${DAYTONA_REGISTRY_PASSWORD:-password}
      - TRANSIENT_REGISTRY_PROJECT_ID=daytona
      - INTERNAL_REGISTRY_URL=http://registry:6000
      - INTERNAL_REGISTRY_ADMIN=admin
      - INTERNAL_REGISTRY_PASSWORD=${DAYTONA_REGISTRY_PASSWORD:-password}
      - INTERNAL_REGISTRY_PROJECT_ID=daytona
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_SECURE=
      - SMTP_EMAIL_FROM=Daytona Team <no-reply@daytona.io>
      - S3_ENDPOINT=http://minio:9000
      - S3_STS_ENDPOINT=http://minio:9000/minio/v1/assume-role
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_DEFAULT_BUCKET=daytona
      - S3_ACCOUNT_ID=/
      - S3_ROLE_NAME=/
      - ENVIRONMENT=docker-compose
      - MAX_AUTO_ARCHIVE_INTERVAL=43200
      - MAINTENANCE_MODE=false
      - PROXY_DOMAIN=${PROXY_DOMAIN:-proxy.localhost:4000}
      - PROXY_PROTOCOL=${PROXY_PROTOCOL:-http}
      - PROXY_API_KEY=${DAYTONA_PROXY_API_KEY}
      - PROXY_TEMPLATE_URL=${PROXY_PROTOCOL:-http}://{{PORT}}-{{sandboxId}}.${PROXY_DOMAIN:-proxy.localhost:4000}
      - DEFAULT_RUNNER_DOMAIN=runner:3003
      - DEFAULT_RUNNER_API_URL=http://runner:3003
      - DEFAULT_RUNNER_PROXY_URL=http://runner:3003
      - DEFAULT_RUNNER_API_KEY=${DAYTONA_RUNNER_API_KEY}
      # Runner capacity SEED values only — do NOT rely on these to cap load.
      # Verified on-chain: the daytona-runner auto-detects the host's real
      # CPU/MEM/DISK and registers those (e.g. MEMORY=8 here showed up as the
      # host's actual 14GiB), so MEM/DISK overrides are effectively ignored.
      # The scheduler also does not hard-cap concurrency (it overcommits: 90×
      # 1C/1G scheduled onto a 12-core runner in testing). To actually bound
      # concurrent sandboxes, enforce org quotas (DEFAULT_REGION_ENFORCE_QUOTAS
      # + DEFAULT_ORG_QUOTA_TOTAL_*), not these vars.
      - DEFAULT_RUNNER_CPU=${DEFAULT_RUNNER_CPU:-4}
      - DEFAULT_RUNNER_MEMORY=${DEFAULT_RUNNER_MEMORY:-8}
      - DEFAULT_RUNNER_DISK=${DEFAULT_RUNNER_DISK:-50}
      - DEFAULT_RUNNER_NAME=default
      - DEFAULT_REGION_ID=us
      - DEFAULT_REGION_NAME=us
      - DEFAULT_REGION_ENFORCE_QUOTAS=false
      - DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA=100000
      - DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX=1000
      - DEFAULT_ORG_QUOTA_SNAPSHOT_QUOTA=1000
      - DEFAULT_ORG_QUOTA_MAX_SNAPSHOT_SIZE=1000
      - ADMIN_MAX_CPU_PER_SANDBOX=100
      - ADMIN_MAX_MEMORY_PER_SANDBOX=100
      - ADMIN_MAX_DISK_PER_SANDBOX=1000
      - ADMIN_TOTAL_CPU_QUOTA=10000
      - ADMIN_TOTAL_MEMORY_QUOTA=10000
      - ADMIN_TOTAL_DISK_QUOTA=100000
      - ADMIN_SNAPSHOT_QUOTA=1000
      - ADMIN_VOLUME_QUOTA=10000
      - DEFAULT_ORG_QUOTA_VOLUME_QUOTA=10000
      - SSH_GATEWAY_API_KEY=${DAYTONA_SSH_GATEWAY_API_KEY}
      - SSH_GATEWAY_COMMAND=ssh -p 2222 {{TOKEN}}@localhost
      - SSH_GATEWAY_URL=localhost:2222
      - SSH_GATEWAY_PUBLIC_KEY=${DAYTONA_SSH_GATEWAY_PUBLIC_KEY}
      - SKIP_USER_EMAIL_VERIFICATION=true
      - RUN_MIGRATIONS=true
      - HEALTH_CHECK_API_KEY=${DAYTONA_HEALTH_CHECK_API_KEY}
      - ADMIN_API_KEY=${DAYTONA_ADMIN_KEY}
      - POSTHOG_API_KEY=
      - POSTHOG_HOST=
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
      daytona-redis:
        condition: service_started
      dex:
        condition: service_started
      registry:
        condition: service_started
    networks:
      - app-net
    restart: always
    privileged: true

  runner:
    image: daytonaio/daytona-runner:v0.189.0-amd64
    # Sysbox at the outer boundary: host dockerd starts the runner via
    # sysbox-runc so the runner (and its DinD + user sandboxes) live in a
    # user namespace. Container uid 0 maps to a non-root uid on host, so
    # even a privileged user sandbox escaping to the runner is not host
    # root. Preserves the DinD + internal-registry topology unchanged;
    # only the outer runtime shifts. Requires sysbox-runc registered on
    # the host dockerd (see 0g-tapp gcp-cvm build-gcp-tapp.sh ENABLE_SYSBOX).
    # Set RUNNER_RUNTIME=sysbox-runc to enable (needs host kernel >=5.12 for
    # shiftfs/idmapped-mounts; on 5.10 sysbox can't write resolv.conf). Default runc.
    runtime: ${RUNNER_RUNTIME:-runc}
    environment:
      - ENVIRONMENT=production
      - API_PORT=3003
      - DAYTONA_RUNNER_TOKEN=${DAYTONA_RUNNER_API_KEY}
      - LOG_FILE_PATH=/home/daytona/runner/runner.log
      # Image default is true (baked into Dockerfile); must explicitly set
      # to false to enable Docker CFS/memory cgroup limits on sandbox containers.
      - RESOURCE_LIMITS_DISABLED=false
      # Native cross-sandbox network isolation (v0.179+). Runner spawns user
      # containers on a dedicated bridge with icc disabled; direct L3 between
      # sandbox IPs is dropped by dockerd. Verified end-to-end on wei-tapp2:
      # docker0 → 172.20.0.0/16 bridge, curl/TCP between sandboxes times out.
      # Supersedes the previous `runner-firewall` sidecar that relied on the
      # host having br_netfilter loaded (unavailable on default GCP Ubuntu).
      - INTER_SANDBOX_NETWORK_ENABLED=false
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_BUCKET=daytona
      - DAYTONA_API_URL=http://api:3000/api
      - RUNNER_DOMAIN=${RUNNER_DOMAIN:-runner}
      - SSH_GATEWAY_ENABLE=true
      - SSH_PUBLIC_KEY=${DAYTONA_SSH_GATEWAY_PUBLIC_KEY}
    networks:
      - app-net
    depends_on:
      - minio
    privileged: true
    restart: always

  proxy:
    image: ${DAYTONA_PROXY_IMAGE:-daytonaio/daytona-proxy:v0.189.0-amd64}
    ports:
      - "4000:4000"
    environment:
      - DAYTONA_API_URL=http://api:3000/api
      - PROXY_PORT=4000
      - PROXY_API_KEY=${DAYTONA_PROXY_API_KEY}
      - PROXY_PROTOCOL=${PROXY_PROTOCOL:-http}
      - OIDC_CLIENT_ID=daytona
      - OIDC_CLIENT_SECRET=
      - OIDC_DOMAIN=http://dex:5556/dex
      - OIDC_PUBLIC_DOMAIN=http://localhost:5556/dex
      - OIDC_AUDIENCE=daytona
      - REDIS_HOST=daytona-redis
      - REDIS_PORT=6379
      - TOOLBOX_ONLY_MODE=false
      - PREVIEW_WARNING_ENABLED=false
    networks:
      - app-net
    restart: always

  ssh-gateway:
    image: daytonaio/daytona-ssh-gateway:v0.189.0-amd64
    ports:
      - "2222:2222"
    environment:
      - API_URL=http://api:3000/api
      - API_KEY=${DAYTONA_SSH_GATEWAY_API_KEY}
      - SSH_GATEWAY_PORT=2222
      - SSH_PRIVATE_KEY=${DAYTONA_SSH_GATEWAY_PRIVATE_KEY}
      - SSH_HOST_KEY=${DAYTONA_SSH_GATEWAY_HOST_KEY}
    networks:
      - app-net
    restart: always

  dex:
    image: dexidp/dex@sha256:1b4a6eee8550240b0faedad04d984ca939513650e1d9bd423502c67355e3822f
    volumes:
      - ./config/dex/config.yaml:/etc/dex/config.yaml
      - ${DEX_DB_DATA:-dex_db}:/var/dex
    entrypoint: ['sh', '-c', 'touch /var/dex/dex.db && exec dex serve /etc/dex/config.yaml']
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app-net
    restart: unless-stopped

  db:
    image: postgres@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    environment:
      - POSTGRES_PASSWORD=${DAYTONA_DB_PASSWORD}
      - POSTGRES_USER=${DAYTONA_DB_USER}
      - POSTGRES_DB=${DAYTONA_DB_NAME}
    volumes:
      - ${DB_DATA_VOLUME:-db_data_prod}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAYTONA_DB_USER} -d ${DAYTONA_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - app-net
    restart: unless-stopped

  # v0.189 initialises the admin api_key with an empty permissions array,
  # which returns 403 on every write op (stop/start/create). Grant the full
  # v0.189 permission enum once the api has finished migrations. Idempotent:
  # the WHERE clause skips the row after the first successful update.
  grant-admin-perms:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DAYTONA_DB_PASSWORD}
    command:
      - psql
      - -h
      - db
      - -U
      - ${DAYTONA_DB_USER}
      - -d
      - ${DAYTONA_DB_NAME}
      - -v
      - ON_ERROR_STOP=1
      - -c
      - |
        UPDATE api_key
           SET permissions = '{write:registries,delete:registries,write:snapshots,delete:snapshots,write:sandboxes,delete:sandboxes,read:volumes,write:volumes,delete:volumes,write:regions,delete:regions,read:runners,write:runners,delete:runners,read:audit_logs}'
         WHERE name = 'daytona-admin' AND permissions = '{}';
    networks:
      - app-net
    restart: on-failure:5

  daytona-redis:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    volumes:
      - ${DAYTONA_REDIS_DATA:-daytona_redis_data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MINIO_DATA:-minio_data}:/data
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app-net
    restart: unless-stopped

  registry:
    image: registry@sha256:bcece5dd3d4b6189e13e7ac71b2ccbc2aae649365f0c589852d687efeba6b290
    environment:
      REGISTRY_HTTP_ADDR: registry:6000
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  sandbox_redis_data:
  sandbox_redis_data_dev:
  daytona_redis_data:
  daytona_redis_data_dev:
  dex_db:
  dex_db_dev:
  db_data:
  db_data_test:
  db_data_dev:
  db_data_prod:
  minio_data:
  minio_data_dev:
  registry_data:
